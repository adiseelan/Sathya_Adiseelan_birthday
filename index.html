<!DOCTYPE html>
<html lang="en" translate="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="google" content="notranslate">
<meta name="theme-color" content="#150822">
<title>Oru Surprise... 🤫</title>
<!-- WhatsApp link preview-la idhu thaan varum (surprise spoil aagadhu) -->
<meta name="description" content="Unakkaga oru chinna surprise 💛 Thirandhu paaru...">
<meta property="og:title" content="Oru Surprise... 🤫">
<meta property="og:description" content="Unakkaga oru chinna surprise 💛 Thirandhu paaru...">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%AA%94%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Yatra+One&family=Poppins:wght@300;400;600&family=Caveat:wght@600&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { height:100%; overflow:hidden; overscroll-behavior:none; }  /* pull-to-refresh-la page reload aagadhu */
  body {
    background: radial-gradient(ellipse at 50% 120%, #2b0f3a 0%, #150822 45%, #0a0414 100%);
    font-family:'Poppins', sans-serif;
    color:#f5e9d0;
    touch-action: manipulation;
    user-select:none; -webkit-user-select:none;
    -webkit-touch-callout:none;   /* iPhone-la long press menu varaadhu */
  }

  /* petals: celebration + letter rendukkum pinnadi vizhum */
  #petalCanvas {
    position:fixed; inset:0; width:100%; height:100%;
    z-index:1; pointer-events:none;
  }

  .stage {
    position:absolute; inset:0; z-index:2;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    opacity:0; pointer-events:none;
    transition: opacity 1.2s ease;
    padding:24px;
    text-align:center;
  }
  .stage.active { opacity:1; pointer-events:auto; }

  /* ---------- STAGE 1 : THE DIYA ---------- */
  .hint {
    font-size:15px; letter-spacing:0.5px; color:#d9c7a3;
    margin-bottom:8px; line-height:1.7; font-weight:300;
    animation: fadeUp 2s ease both;
  }
  .hint b { color:#ffd166; font-weight:600; }
  .hint, .stage2-sub, .bday-date { text-wrap:balance; }

  .diya-wrap {
    margin-top:34px;
    cursor:pointer;
    animation: fadeUp 2.4s ease both;
    position:relative;
  }
  .diya {
    width:120px; height:auto;
    display:block;
    filter: drop-shadow(0 0 24px rgba(255,170,60,0.45));
    transition: transform .3s ease;
  }
  .diya-wrap:active .diya { transform:scale(0.94); }
  .flame {
    transform-box: fill-box;      /* FIX: flame thiri mela irundhe flicker aagum (munnadi mela-keezha aadichu) */
    transform-origin: 50% 90%;
    animation: flicker 1.6s ease-in-out infinite;
  }
  @keyframes flicker {
    0%,100% { transform:scaleY(1) scaleX(1); opacity:1; }
    30% { transform:scaleY(1.12) scaleX(0.92); opacity:.92; }
    60% { transform:scaleY(0.9) scaleX(1.06); opacity:1; }
  }
  .tap-ring {
    position:absolute; left:50%; top:29%;
    width:70px; height:70px; border-radius:50%;
    border:2px solid rgba(255,210,120,0.6);
    transform:translate(-50%,-50%);
    animation: ring 2s ease-out infinite;
    pointer-events:none;
  }
  @keyframes ring {
    0% { transform:translate(-50%,-50%) scale(0.5); opacity:.9; }
    100% { transform:translate(-50%,-50%) scale(1.6); opacity:0; }
  }
  .sound-hint {
    margin-top:34px; font-size:12px; color:#9d8c6c; letter-spacing:.4px; font-weight:300;
    animation: fadeUp 3s ease both;
  }

  /* floating diyas that rise after tap */
  .float-diya {
    position:absolute; bottom:-80px;
    font-size:34px;
    animation: rise linear forwards;
    pointer-events:none;
    filter: drop-shadow(0 0 12px rgba(255,180,80,.7));
  }
  @keyframes rise {
    0% { transform: translateY(0) rotate(0deg); opacity:0; }
    12% { opacity:1; }
    100% { transform: translateY(-110vh) rotate(14deg); opacity:.85; }
  }

  /* ---------- STAGE 2 : THE CAKE ---------- */
  .stage2-title {
    font-family:'Yatra One', cursive;
    font-size:clamp(22px, 6vw, 34px);
    color:#ffd166;
    margin-bottom:6px;
    text-shadow:0 0 30px rgba(255,190,80,.35);
  }
  .stage2-sub { font-size:14px; color:#cbb890; font-weight:300; margin-bottom:44px; line-height:1.7; }
  .stage2-sub b { color:#ff9de2; font-weight:600; }

  .cake {
    position:relative;
    width:min(300px, 80vw);
  }
  .cake svg { width:100%; height:auto; display:block; }

  /* FIX: candles ippo top tier mela correct-a nikkum
     (munnadi cake-ku mela float aachu, oram irundha 2 candle cake-ku veliya irundhuchu) */
  .candles {
    position:absolute;
    left:26.7%; right:26.7%;     /* top tier = x 80..220 (300-la) */
    bottom:65%;                  /* candle adi = top tier cream */
    display:flex; justify-content:space-around; align-items:flex-end;
  }
  .candle {
    position:relative; flex:1 1 0; max-width:34px; height:86px;   /* periya touch area */
    cursor:pointer; touch-action:none;
  }
  .candle .stick {
    position:absolute; bottom:0; left:calc(50% - 5px);
    width:10px; height:44px; border-radius:4px;
    background: repeating-linear-gradient(135deg, #ff8fb8 0 6px, #ffe3f0 6px 12px);
    box-shadow: inset -2px 0 3px rgba(0,0,0,.18);
  }
  /* FIX: flame stick-ku nadu-la (munnadi 7px valadhu pakkam nagandhu irundhuchu),
     press pannumbodhu flame chinnadha aagum (munnadi animation adha block pannuchu) */
  .candle .cflame {
    position:absolute; bottom:44px; left:calc(50% - 7px);
    width:14px; height:22px;
    background: radial-gradient(circle at 50% 78%, #fff5c2 0%, #ffc94d 45%, #ff8c1a 75%, transparent 78%);
    border-radius:50% 50% 50% 50% / 62% 62% 38% 38%;
    transform-origin:50% 100%;
    animation: flicker 1.1s ease-in-out infinite;
    filter: drop-shadow(0 0 10px rgba(255,180,60,.85));
    transition: scale .1s linear, opacity .25s ease;
  }
  .candle .smoke {
    position:absolute; bottom:48px; left:calc(50% - 4px);
    width:8px; height:8px; border-radius:50%;
    background:rgba(200,200,210,.55);
    opacity:0; pointer-events:none;
  }
  .candle.out .cflame { opacity:0; animation:none; transform:scale(.6, .1); }
  .candle.out .smoke { animation: smokeUp 1.4s ease-out forwards; }
  @keyframes smokeUp {
    0% { opacity:.8; transform:translate(0,0) scale(1); }
    100% { opacity:0; transform:translate(2px,-46px) scale(2.6); }
  }
  .blow-progress {
    margin-top:26px; font-size:13px; color:#b8a67f; letter-spacing:1px; min-height:20px;
  }

  /* ---------- BLACKOUT ---------- */
  #blackout {
    position:absolute; inset:0; background:#000;
    opacity:0; pointer-events:none;
    transition:opacity .9s ease;
    z-index:40;
  }
  #blackout.on { opacity:1; }

  /* ---------- STAGE 3 : CELEBRATION ---------- */
  #fireCanvas {
    position:absolute; inset:0; width:100%; height:100%;
    pointer-events:none;
  }
  .celebrate-content { position:relative; z-index:5; }

  .bday-eyebrow {
    font-size:13px; letter-spacing:5px; color:#ff9de2;
    text-transform:uppercase; margin-bottom:14px;
    animation: fadeUp 1.4s .4s ease both;
  }
  .bday-title {
    font-family:'Yatra One', cursive;
    font-size:clamp(28px, calc((100vw - 48px) / 8.5), 72px);   /* FIX: "Dear Sathyavani" ore line-la varum (munnadi 3 line aachu) */
    text-wrap:balance;
    line-height:1.15;
    background: linear-gradient(90deg, #ffd166, #ff9933, #ff5e9e, #ffd166);
    background-size:300% 100%;
    -webkit-background-clip:text; background-clip:text;
    -webkit-text-fill-color:transparent; color:transparent;
    animation: shimmer 4s linear infinite, popIn 1s .7s cubic-bezier(.2,1.6,.4,1) both;
    text-shadow:none;
  }
  @keyframes shimmer { to { background-position:300% 0; } }
  @keyframes popIn {
    0% { transform:scale(.4); opacity:0; }
    100% { transform:scale(1); opacity:1; }
  }
  .bday-date {
    margin-top:14px; font-size:15px; color:#e8d9b5; font-weight:300;
    animation: fadeUp 1.4s 1.4s ease both;
  }
  .bday-date span { color:#ffd166; font-weight:600; }
  .next-btn {
    margin-top:40px;
    background:linear-gradient(135deg, #ff9933, #ff5e9e);
    color:#fff; border:none; border-radius:40px;
    padding:13px 34px; font-size:15px; font-family:'Poppins',sans-serif; font-weight:600;
    letter-spacing:.5px;
    box-shadow:0 8px 26px rgba(255,110,90,.4);
    cursor:pointer;
    animation: fadeUp 1.4s 2.2s ease both;
    transition:transform .2s;
  }
  .next-btn:active { transform:scale(.95); }

  /* ---------- STAGE 4 : LETTER ---------- */
  .letter-card {
    position:relative; z-index:5;
    width:min(560px, 92vw);
    height:min(64vh, 600px);          /* FIX: fixed height, type aagumbodhu card kudhikkaadhu */
    max-height:calc(100% - 70px);
    overflow-y:auto; overscroll-behavior:contain; -webkit-overflow-scrolling:touch;
    background:linear-gradient(160deg, #fff9ee, #ffeeda);
    color:#4a3421;
    border-radius:18px;
    padding:34px 26px 30px;
    box-shadow:0 24px 70px rgba(0,0,0,.55), 0 0 0 1px rgba(255,255,255,.08);
    text-align:left;
  }
  .letter-card::before {
    content:"🪔"; position:absolute; top:14px; right:18px; font-size:22px; opacity:.85;
  }
  .letter-head {
    font-family:'Yatra One', cursive;
    color:#c2571f; font-size:22px; margin-bottom:16px;
  }
  #letterText {
    font-family:'Caveat', cursive;
    font-size:clamp(20px, 5vw, 25px);
    line-height:1.55;
    white-space:pre-wrap;
  }
  .cursor {
    display:inline-block; width:2px; height:1.1em;
    background:#c2571f; vertical-align:-3px; margin-left:1px;
    animation: blink .8s step-end infinite;
  }
  @keyframes blink { 50% { opacity:0; } }

  /* optional photo — letter mudinjadhum varum */
  .polaroid {
    margin:24px auto 6px; width:min(230px, 72%);
    background:#fff; padding:10px 10px 8px; border-radius:4px;
    box-shadow:0 12px 28px rgba(74,52,33,.3);
    opacity:0; transform:rotate(-3deg) translateY(16px) scale(.92);
    transition:opacity 1s ease, transform 1.1s cubic-bezier(.2,1.4,.4,1);
  }
  .polaroid.show { opacity:1; transform:rotate(-3deg) translateY(0) scale(1); }
  .polaroid img { display:block; width:100%; aspect-ratio:4/5; object-fit:cover; border-radius:2px; background:#f3e6d6; }
  .polaroid figcaption { font-family:'Caveat', cursive; font-size:24px; color:#c2571f; text-align:center; margin-top:4px; }

  .replay {
    margin-top:22px; z-index:5; position:relative;
    background:transparent; border:1px solid rgba(255,209,102,.5);
    color:#ffd166; border-radius:30px; padding:9px 24px;
    font-family:'Poppins',sans-serif; font-size:13px; cursor:pointer;
    opacity:0; pointer-events:none; transition:opacity 1s;   /* FIX: theriyaadha button-a thottaa reload aagadhu */
  }
  .replay.show { opacity:1; pointer-events:auto; }

  @keyframes fadeUp {
    from { opacity:0; transform:translateY(18px); }
    to { opacity:1; transform:translateY(0); }
  }

  /* ---------- MUSIC BAR ---------- */
  #musicBar {
    position:fixed; left:50%; bottom:calc(14px + env(safe-area-inset-bottom, 0px));
    transform:translate(-50%, 30px);
    z-index:60;
    display:flex; align-items:center; gap:10px;
    max-width:calc(100vw - 28px);
    background:rgba(20,8,34,0.78);
    -webkit-backdrop-filter:blur(8px); backdrop-filter:blur(8px);
    border:1px solid rgba(255,209,102,.25);
    border-radius:40px;
    padding:6px 18px 6px 6px;
    opacity:0; pointer-events:none;
    transition: opacity .9s ease, transform .9s ease;
  }
  #musicBar.show { opacity:1; transform:translate(-50%, 0); pointer-events:auto; }
  #musicBar.no-btn { padding:9px 18px; }
  #musicBar.no-btn #playPauseBtn { display:none; }
  #playPauseBtn {
    flex:none; width:36px; height:36px; border-radius:50%; border:none; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    background:linear-gradient(135deg,#ff9933,#ff5e9e);
    box-shadow:0 4px 14px rgba(255,110,90,.4);
    transition:transform .15s;
  }
  #playPauseBtn:active { transform:scale(.9); }
  #playPauseBtn::before {                        /* play icon */
    content:''; width:0; height:0; margin-left:3px;
    border-style:solid; border-width:7px 0 7px 12px;
    border-color:transparent transparent transparent #fff;
  }
  #musicBar.playing #playPauseBtn::before {      /* pause icon */
    width:12px; height:14px; margin-left:0;
    border-width:0 4px; border-color:#fff;
  }
  #nowPlaying {
    font-size:12.5px; color:#ffd166; letter-spacing:.3px;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .eq { flex:none; display:inline-flex; align-items:flex-end; gap:2px; height:12px; }
  .eq i { display:block; width:3px; height:4px; border-radius:1px; background:#ffd166; }
  #musicBar.playing .eq i { animation: eq .9s ease-in-out infinite; }
  #musicBar.playing .eq i:nth-child(2) { animation-delay:.2s; }
  #musicBar.playing .eq i:nth-child(3) { animation-delay:.4s; }
  @keyframes eq { 0%,100% { height:4px; } 50% { height:12px; } }
  body.music-on #stage4 { padding-bottom:calc(86px + env(safe-area-inset-bottom, 0px)); }

  /* ---------- ?check mode badge (unakku mattum, test panna) ---------- */
  .check-badge {
    position:fixed; top:calc(10px + env(safe-area-inset-top, 0px)); left:50%; transform:translateX(-50%);
    z-index:70; width:max-content; max-width:92vw;
    background:rgba(0,0,0,.86); color:#fff; border:1px solid rgba(255,255,255,.25);
    border-radius:12px; padding:10px 14px; font-size:12.5px; line-height:1.6; text-align:left;
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration:.01s !important; animation-iteration-count:1 !important; transition-duration:.01s !important; }
  }
</style>
</head>
<body>

<canvas id="petalCanvas"></canvas>

<!-- ================= STAGE 1 : DIYA ================= -->
<div class="stage active" id="stage1">
  <p class="hint">Sathya ma... oru nimisham 🤫<br><b>Indha deepam ah thottu paaru</b></p>
  <div class="diya-wrap" id="diyaTap" role="button" aria-label="Deepam">
    <div class="tap-ring"></div>
    <svg class="diya" viewBox="0 0 120 130" xmlns="http://www.w3.org/2000/svg">
      <!-- flame -->
      <g class="flame">
        <ellipse cx="60" cy="38" rx="11" ry="20" fill="#ff8c1a"/>
        <ellipse cx="60" cy="42" rx="7" ry="13" fill="#ffc94d"/>
        <ellipse cx="60" cy="46" rx="3.5" ry="7" fill="#fff5c2"/>
      </g>
      <!-- wick -->
      <rect x="58.5" y="56" width="3" height="8" rx="1.5" fill="#5a3a1a"/>
      <!-- diya bowl -->
      <path d="M18 70 Q60 60 102 70 Q102 100 60 106 Q18 100 18 70 Z" fill="#b3541e"/>
      <path d="M18 70 Q60 60 102 70 Q60 82 18 70 Z" fill="#e07b39"/>
      <ellipse cx="60" cy="112" rx="30" ry="6" fill="#7a3413"/>
    </svg>
  </div>
  <p class="sound-hint">🔊 Sound on pannikko</p>
</div>

<!-- ================= STAGE 2 : CAKE ================= -->
<div class="stage" id="stage2">
  <div class="stage2-title">Ippo un vela 😄</div>
  <p class="stage2-sub"><span id="candleCount">5</span> candles iruku Thango...<br>Ovvonnaiyum <b>konja neram press panni</b> oodhu 🌬️</p>
  <div class="cake">
    <div class="candles" id="candles"></div>
    <svg viewBox="0 0 300 190" xmlns="http://www.w3.org/2000/svg">
      <!-- plate -->
      <ellipse cx="150" cy="178" rx="140" ry="12" fill="#3a1f4d"/>
      <!-- bottom tier -->
      <rect x="45" y="110" width="210" height="62" rx="12" fill="#8e4bbf"/>
      <rect x="45" y="110" width="210" height="20" rx="10" fill="#a866d6"/>
      <!-- top tier -->
      <rect x="80" y="62" width="140" height="52" rx="10" fill="#ff7fb2"/>
      <!-- drips -->
      <path d="M80 74 q10 0 10 12 q0 10 8 10 q8 0 8 -12 q0 -12 10 -12 q10 0 10 14 q0 12 9 12 q9 0 9 -14 q0 -12 10 -12 q10 0 10 12 q0 12 9 12 q9 0 9 -13 q0 -11 9 -11 q9 0 9 10 L220 62 L80 62 Z" fill="#ffd9e8"/>
      <!-- sprinkles -->
      <circle cx="105" cy="140" r="4" fill="#ffd166"/>
      <circle cx="150" cy="152" r="4" fill="#7de3a0"/>
      <circle cx="195" cy="138" r="4" fill="#ffd166"/>
      <circle cx="128" cy="158" r="3.5" fill="#ff9de2"/>
      <circle cx="172" cy="160" r="3.5" fill="#8fd0ff"/>
    </svg>
  </div>
  <div class="blow-progress" id="blowMsg">✨</div>
</div>

<div id="blackout"></div>

<!-- ================= STAGE 3 : CELEBRATION ================= -->
<div class="stage" id="stage3">
  <canvas id="fireCanvas"></canvas>
  <div class="celebrate-content">
    <div class="bday-eyebrow">✦ November 26 ✦</div>
    <h1 class="bday-title">Happy Birthday<br>Dear Sathyavani</h1>
    <p class="bday-date">Indha naal <span>unaku mattum</span> thaan 💛</p>
    <button class="next-btn" id="toLetter">Onnu iruku... paaru 💌</button>
  </div>
</div>

<!-- ================= STAGE 4 : LETTER ================= -->
<div class="stage" id="stage4">
  <div class="letter-card" id="letterCard">
    <div class="letter-head">Dear Sathyavani,</div>
    <div id="letterText"><span id="typed"></span><span class="cursor" id="cursor"></span></div>
    <figure class="polaroid" id="polaroid" hidden>
      <img id="photo" alt="Naama">
      <figcaption id="photoCaption"></figcaption>
    </figure>
  </div>
  <button class="replay" id="replayBtn">↻ Innoru murai paakanuma?</button>
</div>

<!-- ================= SONG ================= -->
<!-- FIX: munnadi indha SONG comment close aagave illa. Adhanala keezha irundha
     audio, music bar, script ellame comment-ah maari, deepam thottaa edhuvume nadakkala. -->
<audio id="song" loop preload="auto"></audio>
<div id="musicBar">
  <button id="playPauseBtn" aria-label="Play / pause"></button>
  <span class="eq" aria-hidden="true"><i></i><i></i><i></i></span>
  <span id="nowPlaying"></span>
</div>

<script>
/* =====================================================
   EDIT PANNANUM NA: indha settings mattum maathunga
   ===================================================== */
const LETTER = `Unna wish panna oru website eh
build pannitten paaru! 😎

Engagement aana apram varra
un first birthday idhu...
adhanala enakkum idhu romba special 💛

Indha varusham un ella kanavum
nichayama nadakkanum.
Feb 11 ku countdown already
start aagiduchu 🤭

Happy Birthday once again! 🎂🪔

— Un adiseelan ❤️`;

const NUM_CANDLES  = 5;
const BLOW_HOLD_MS = 900;     // evlo neram press pannanum (ms)

/* SONG
   - index.html irukura ADHE folder-la indha file irukanum (sub-folder illa)
   - spelling + Capital letters exact-a match aaganum (GitHub Pages case-sensitive)
   - test panna: un-link-ku pinnadi ?check pottu open pannu  (eg: .../?check) */
const SONG_FILE      = 'Yen-Endral.mp3';
const SONG_TITLE     = 'Yen Endral... Un Pirandhanaal 🎶';
const SONG_START_AT  = 0;              // intro skip panna seconds (eg: 20). 0 = start-la irundhu
const SONG_STARTS_ON = 'celebration';  // 'celebration' = Happy Birthday screen-la | 'letter' = letter open aana odane

/* PHOTO (optional): 'photo.jpg' nu oru photo index.html pakkathula pottaa,
   letter mudinjadhum polaroid-a varum. Photo illana edhuvum kaatadhu. */
const PHOTO_FILE    = 'photo.jpg';
const PHOTO_CAPTION = 'Naama 💛';

/* ---------- helpers ---------- */
const $ = id => document.getElementById(id);
function showStage(n){
  document.querySelectorAll('.stage').forEach(s => s.classList.remove('active'));
  $('stage' + n).classList.add('active');
}

/* ---------- WebAudio effects (chime / pop / typing tick / backup melody) ---------- */
let actx = null;
function audio(){
  if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
  if (actx.state === 'suspended') actx.resume();
  return actx;
}
function tone(freq, t0, dur, type = 'triangle', vol = 0.18){
  try {   // FIX: sound fail aanaalum page nikkaadhu
    const ctx = audio(), t = ctx.currentTime + t0;
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.03);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(ctx.destination);
    o.start(t); o.stop(t + dur + 0.05);
  } catch (e) {}
}
function chime(){ tone(880, 0, .4, 'sine', .12); tone(1318, .08, .5, 'sine', .09); }
function pop(){ tone(240, 0, .12, 'square', .08); }

/* Song file kedaikkalana mattum indha Happy Birthday melody olikkum */
function happyBirthdayTune(){
  const N = {G4:392, A4:440, B4:494, C5:523, D5:587, E5:659, F5:698, G5:784};
  const seq = [
    [N.G4,.28],[N.G4,.22],[N.A4,.5],[N.G4,.5],[N.C5,.5],[N.B4,.9],
    [N.G4,.28],[N.G4,.22],[N.A4,.5],[N.G4,.5],[N.D5,.5],[N.C5,.9],
    [N.G4,.28],[N.G4,.22],[N.G5,.5],[N.E5,.5],[N.C5,.5],[N.B4,.5],[N.A4,.9],
    [N.F5,.28],[N.F5,.22],[N.E5,.5],[N.C5,.5],[N.D5,.5],[N.C5,1.1]
  ];
  let t = 0.3;
  seq.forEach(([f, d]) => { tone(f, t, d * 0.92, 'triangle', .16); t += d; });
  return t;   // total seconds
}

/* =========================================================
   SONG — ore oru file (SONG_FILE). Kedaikkalana -> melody.
   FIX: duplicate paths, song.m4a/ogg, Spotify link (vera paatu!) ellam remove.
   ========================================================= */
const song = $('song'), bar = $('musicBar'), ppBtn = $('playPauseBtn');
let songState = 'idle';          // idle | loading | ready | failed
let wantPlay = false, fallbackTune = false, fallbackEnd = 0;

function musicPlaying(){
  return (!song.paused && !song.ended) || (fallbackTune && performance.now() < fallbackEnd);
}
function showBar(text, withButton){
  $('nowPlaying').textContent = text;
  bar.classList.toggle('no-btn', !withButton);
  bar.classList.add('show');
  document.body.classList.add('music-on');
}
function setBtn(playing){
  bar.classList.toggle('playing', playing);
  ppBtn.setAttribute('aria-label', playing ? 'Pause' : 'Play');
}
song.addEventListener('error', () => {
  if (songState === 'failed') return;
  songState = 'failed';
  console.warn('[song] "' + SONG_FILE + '" load aagala. File name / folder check pannunga (?check)');
  if (wantPlay) startFallback();
});
song.addEventListener('canplay', () => { if (songState === 'loading') songState = 'ready'; });
song.addEventListener('playing', () => { if (!song.muted) setBtn(true); });
song.addEventListener('pause',   () => setBtn(false));

/* DEEPAM tap (real touch): file load aaga start + iPhone-kaga oru silent play/pause.
   Appo thaan appuram celebration-la touch illaama kooda paatu start aagum. */
function primeSong(){
  if (songState !== 'idle' || !SONG_FILE) return;
  songState = 'loading';
  song.src = SONG_FILE;
  song.muted = true;
  const done = () => {
    if (!wantPlay){ song.pause(); try { song.currentTime = 0; } catch (e) {} }
    song.muted = false;
  };
  const p = song.play();
  if (p && p.then) p.then(done, () => { song.muted = false; });
  else done();
}

function playSong(){
  if (wantPlay) return;                       // already start aagiduchu
  wantPlay = true;
  if (songState === 'failed' || !SONG_FILE){ startFallback(); return; }
  if (songState === 'idle'){ songState = 'loading'; song.src = SONG_FILE; }
  showBar(SONG_TITLE, true);
  try {
    if ('mediaSession' in navigator && window.MediaMetadata)
      navigator.mediaSession.metadata = new MediaMetadata({ title: SONG_TITLE, artist: 'Sathya-kaga 💛' });
  } catch (e) {}
  if (SONG_START_AT > 0 && song.currentTime < SONG_START_AT){ try { song.currentTime = SONG_START_AT; } catch (e) {} }
  song.muted = false;
  fadeIn();
  const p = song.play();
  if (p && p.then) p.then(() => setBtn(true)).catch(err => {
    if (err && err.name === 'NotAllowedError'){
      wantPlay = false;      // browser block pannuchu: adutha tap-la (letter button / play button) start aagum
      setBtn(false);
    }
  });
}
function fadeIn(){
  let v = 0.15; song.volume = v;              // (iPhone volume maatha vidaadhu, parava illa)
  const t = setInterval(() => { v = Math.min(1, v + 0.06); song.volume = v; if (v >= 1) clearInterval(t); }, 90);
}
function startFallback(){
  if (fallbackTune) return;
  fallbackTune = true;
  showBar('Happy Birthday to you 🎶', false);   // FIX: "⚠ song file kedaikala" avalukku kaatakoodadhu
  bar.classList.add('playing');
  const dur = happyBirthdayTune();
  fallbackEnd = performance.now() + dur * 1000;
  setTimeout(() => bar.classList.remove('playing', 'show'), dur * 1000 + 600);
}
ppBtn.addEventListener('click', () => {
  if (fallbackTune) return;
  if (song.paused){
    wantPlay = true; song.muted = false;
    const p = song.play(); if (p && p.catch) p.catch(() => {});
  } else song.pause();
});

/* =========================================================
   STAGE 1 -> tap diya, diyas rise, move to cake
   ========================================================= */
$('diyaTap').addEventListener('click', () => {
  primeSong();
  chime();
  const s1 = $('stage1');
  for (let i = 0; i < 14; i++){
    const d = document.createElement('div');
    d.className = 'float-diya';
    d.textContent = Math.random() < .5 ? '🪔' : '✨';
    d.style.left = (5 + Math.random() * 90) + '%';
    d.style.animationDuration = (3.5 + Math.random() * 3) + 's';
    d.style.animationDelay = (Math.random() * 0.8) + 's';
    d.style.fontSize = (22 + Math.random() * 22) + 'px';
    s1.appendChild(d);
  }
  setTimeout(() => showStage(2), 2600);
}, { once:true });

/* =========================================================
   STAGE 2 -> press & hold candles to blow
   ========================================================= */
let outCount = 0;
function cheerText(left){
  if (left <= 0) return 'Ellam off! 🤭 Wait...';
  if (left === 1) return 'Last one Sathya! 🥳';
  const cheers = ['Super! 🌬️', 'Semma! 🔥', 'Kalakkura! 😄', 'Wow! ✨'];
  return cheers[(NUM_CANDLES - left - 1) % cheers.length] + '  Innum ' + left + ' iruku';
}
(function buildCandles(){
  const wrap = $('candles');
  $('candleCount').textContent = NUM_CANDLES;
  wrap.addEventListener('contextmenu', e => e.preventDefault());
  for (let i = 0; i < NUM_CANDLES; i++){
    const c = document.createElement('div');
    c.className = 'candle';
    c.innerHTML = '<div class="cflame"></div><div class="smoke"></div><div class="stick"></div>';
    const flame = c.querySelector('.cflame');
    let timer = null, held = 0;
    const stop = () => {
      if (timer){ clearInterval(timer); timer = null; }
      if (!c.classList.contains('out')) flame.style.scale = '';
    };
    const start = e => {
      if (e.cancelable) e.preventDefault();
      // FIX: rendu viral / double touch-la timer rendu aagi, outCount nikkaama ooduchu
      if (timer || c.classList.contains('out')) return;
      held = 0;
      timer = setInterval(() => {
        held += 60;
        const sc = Math.max(0.15, 1 - held / BLOW_HOLD_MS);
        flame.style.scale = (0.85 + sc * 0.15) + ' ' + sc;     // press panna flame chinnadha aagum
        if (held >= BLOW_HOLD_MS){ stop(); blowOut(c); }
      }, 60);
    };
    c.addEventListener('touchstart', start, { passive:false });
    c.addEventListener('mousedown', start);
    ['touchend', 'touchcancel', 'mouseup', 'mouseleave'].forEach(ev => c.addEventListener(ev, stop));
    wrap.appendChild(c);
  }
})();
function blowOut(c){
  if (c.classList.contains('out')) return;
  c.classList.add('out');
  pop();
  outCount++;
  const left = NUM_CANDLES - outCount;
  $('blowMsg').textContent = cheerText(left);
  if (left === 0){
    setTimeout(() => {
      $('blackout').classList.add('on');
      setTimeout(() => {
        showStage(3);
        $('blackout').classList.remove('on');
        startCelebration();
      }, 1300);
    }, 900);
  }
}

/* =========================================================
   STAGE 3 -> fireworks + marigold petal rain + song
   ========================================================= */
const fc = $('fireCanvas'), pc = $('petalCanvas');
const fx = fc.getContext('2d'), px = pc.getContext('2d');
let W = 0, H = 0, rockets = [], sparks = [], petals = [];
let animating = false, fireInterval = null, petalInterval = null;
function resize(){
  W = innerWidth; H = innerHeight;
  let dpr = Math.min(window.devicePixelRatio || 1, 2);          // phone screen-la sharp-a theriyum
  if (W * H * dpr * dpr > 2.5e6) dpr = Math.max(1, Math.sqrt(2.5e6 / (W * H)));
  [fc, pc].forEach(c => { c.width = Math.round(W * dpr); c.height = Math.round(H * dpr); });
  fx.setTransform(dpr, 0, 0, dpr, 0, 0);
  px.setTransform(dpr, 0, 0, dpr, 0, 0);
}
addEventListener('resize', resize); resize();

const FIRE_COLORS = ['#ffd166', '#ff9933', '#ff5e9e', '#8fd0ff', '#7de3a0', '#ff8fb8'];
function launchRocket(){
  rockets.push({ x: W * (0.15 + Math.random() * 0.7), y: H, vy: -(H * 0.011 + Math.random() * H * 0.004),
                 color: FIRE_COLORS[(Math.random() * FIRE_COLORS.length) | 0], targetY: H * (0.18 + Math.random() * 0.3) });
}
function explode(r){
  if (!musicPlaying()) pop();          // paatu odumbodhu pop sound venaam
  const n = 46;
  for (let i = 0; i < n; i++){
    const a = (Math.PI * 2 * i) / n, sp = 2 + Math.random() * 3.6;
    sparks.push({ x: r.x, y: r.y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: 1, color: r.color });
  }
}
function spawnPetal(){
  petals.push({
    x: Math.random() * W, y: -20,
    vx: (Math.random() - 0.5) * 0.7, vy: 0.8 + Math.random() * 1.4,
    rot: Math.random() * Math.PI * 2, vr: (Math.random() - 0.5) * 0.06,
    size: 6 + Math.random() * 8,
    color: Math.random() < 0.6 ? '#ff9933' : (Math.random() < 0.5 ? '#ffb347' : '#ffd166'),
    sway: Math.random() * Math.PI * 2
  });
}
function drawPetal(p){
  px.save();
  px.translate(p.x, p.y); px.rotate(p.rot);
  px.fillStyle = p.color;
  px.beginPath();
  px.ellipse(0, 0, p.size, p.size * 0.55, 0, 0, Math.PI * 2);
  px.fill();
  px.fillStyle = 'rgba(180,80,10,0.35)';
  px.beginPath();
  px.ellipse(0, 0, p.size * 0.4, p.size * 0.2, 0, 0, Math.PI * 2);
  px.fill();
  px.restore();
}
function loop(){
  if (!animating) return;
  // trails transparent-a fade aagum, so pinnadi petals theriyum
  fx.globalCompositeOperation = 'destination-out';
  fx.fillStyle = 'rgba(0,0,0,0.22)';
  fx.fillRect(0, 0, W, H);
  fx.globalCompositeOperation = 'source-over';
  px.clearRect(0, 0, W, H);

  rockets.forEach(r => {
    r.y += r.vy;
    fx.fillStyle = r.color;
    fx.beginPath(); fx.arc(r.x, r.y, 2.6, 0, Math.PI * 2); fx.fill();
  });
  for (let i = rockets.length - 1; i >= 0; i--){
    if (rockets[i].y <= rockets[i].targetY){ explode(rockets[i]); rockets.splice(i, 1); }
  }
  sparks.forEach(s => {
    s.x += s.vx; s.y += s.vy; s.vy += 0.045; s.vx *= 0.985; s.life -= 0.014;
    fx.globalAlpha = Math.max(s.life, 0);
    fx.fillStyle = s.color;
    fx.beginPath(); fx.arc(s.x, s.y, 2.2, 0, Math.PI * 2); fx.fill();
  });
  fx.globalAlpha = 1;
  sparks = sparks.filter(s => s.life > 0);

  petals.forEach(p => {
    p.sway += 0.03;
    p.x += p.vx + Math.sin(p.sway) * 0.6;
    p.y += p.vy; p.rot += p.vr;
    drawPetal(p);
  });
  petals = petals.filter(p => p.y < H + 30);

  requestAnimationFrame(loop);
}
function startCelebration(){
  if (!animating){ animating = true; requestAnimationFrame(loop); }
  for (let i = 0; i < 4; i++) setTimeout(launchRocket, i * 280);
  fireInterval  = setInterval(launchRocket, 850);
  petalInterval = setInterval(spawnPetal, 130);
  if (SONG_STARTS_ON === 'celebration') playSong();
}

/* =========================================================
   STAGE 4 -> typewriter letter (+ optional photo)
   ========================================================= */
$('toLetter').addEventListener('click', () => {
  clearInterval(fireInterval);
  clearInterval(petalInterval);
  petalInterval = setInterval(spawnPetal, 420);   // letter padikkumbodhu mella petals
  showStage(4);
  playSong();            // already odittu irundha onnum pannaadhu; illana ippo start (real tap)
  setTimeout(typeLetter, 600);
}, { once:true });

// FIX: emoji-ah udaikkaama ezhuthum (munnadi 😎 🪔 maari emoji type aagumbodhu � theriyum)
const GRAPHEMES = (window.Intl && Intl.Segmenter)
  ? Array.from(new Intl.Segmenter(undefined, { granularity: 'grapheme' }).segment(LETTER), s => s.segment)
  : Array.from(LETTER);

let letterDone = false, photoReady = false;
function typeLetter(){
  const typed = $('typed'), card = $('letterCard');
  typed.textContent = '';
  const node = document.createTextNode('');
  typed.appendChild(node);
  let i = 0;
  (function tick(){
    if (i < GRAPHEMES.length){
      const ch = GRAPHEMES[i++];
      const atBottom = card.scrollTop + card.clientHeight >= card.scrollHeight - 30;
      node.appendData(ch);
      if (atBottom) card.scrollTop = card.scrollHeight;     // FIX: letter neelama irundhaa auto-scroll
      if (!musicPlaying() && ch.trim() && i % 3 === 0) tone(600 + Math.random() * 120, 0, .04, 'sine', .02);
      setTimeout(tick, ch === '\n' ? 240 : (/[.!?,]/.test(ch) ? 130 : 38));
    } else {
      letterDone = true;
      $('cursor').style.display = 'none';
      $('replayBtn').classList.add('show');
      revealPhoto();
    }
  })();
}
$('replayBtn').addEventListener('click', () => location.reload());

(function loadPhoto(){
  const img = $('photo'), pol = $('polaroid');
  if (!PHOTO_FILE){ pol.remove(); return; }
  $('photoCaption').textContent = PHOTO_CAPTION;
  img.addEventListener('load', () => { photoReady = true; if (letterDone) revealPhoto(); }, { once:true });
  img.addEventListener('error', () => pol.remove(), { once:true });
  img.src = PHOTO_FILE;
})();
function revealPhoto(){
  const pol = $('polaroid');
  if (!pol || !photoReady || !pol.hidden) return;
  pol.hidden = false;
  requestAnimationFrame(() => requestAnimationFrame(() => pol.classList.add('show')));
  const card = $('letterCard');
  setTimeout(() => card.scrollTo({ top: card.scrollHeight, behavior: 'smooth' }), 150);
}

/* =========================================================
   ?check MODE — link-ku pinnadi ?check pottu open panna,
   song / photo correct path-la irukka nu mela kaatum. (Sathya-ku anupura link-la ?check venaam)
   ========================================================= */
if (/[?&]check\b/i.test(location.search)) runCheck();
function runCheck(){
  const box = document.createElement('div');
  box.className = 'check-badge';
  box.textContent = '🔎 Files check pannittu iruken...';
  document.body.appendChild(box);
  box.addEventListener('click', () => box.remove());
  const head = url => fetch(url, { method: 'HEAD', cache: 'no-store' }).then(r => r.ok).catch(() => null);
  const songDuration = () => new Promise(res => {
    if (!SONG_FILE) return res(-1);
    const a = new Audio(); a.preload = 'metadata';
    const t = setTimeout(() => res(null), 6000);
    a.addEventListener('loadedmetadata', () => { clearTimeout(t); res(a.duration); }, { once:true });
    a.addEventListener('error', () => { clearTimeout(t); res(-1); }, { once:true });
    a.src = SONG_FILE;
  });
  Promise.all([head(SONG_FILE), songDuration(), PHOTO_FILE ? head(PHOTO_FILE) : Promise.resolve(false)])
    .then(([found, dur, photoOk]) => {
      const mmss = s => Math.floor(s / 60) + ':' + String(Math.floor(s % 60)).padStart(2, '0');
      let songLine;
      if (dur > 0)               songLine = '✅ Song OK: ' + SONG_FILE + ' (' + mmss(dur) + ')';
      else if (found === true && dur === -1) songLine = '❌ ' + SONG_FILE + ' irukku, aana play aagala (file corrupt / format?)';
      else if (found === true)   songLine = '✅ Song file irukku: ' + SONG_FILE;
      else if (found === false || dur === -1) songLine = '❌ Song kedaikala: ' + SONG_FILE + ' (name / folder / capital letters check pannu)';
      else                       songLine = '⚠ Check panna mudiyala. GitHub Pages link-la ?check pottu open pannu';
      const photoLine = photoOk ? '✅ Photo OK: ' + PHOTO_FILE : 'ℹ️ Photo illa (' + (PHOTO_FILE || '-') + '). Optional dhaan';
      box.textContent = '';
      [songLine, photoLine, '(idha thottaa close aagum)'].forEach(line => {
        const d = document.createElement('div'); d.textContent = line; box.appendChild(d);
      });
      console.info('[check]', songLine, '|', photoLine);
    });
}
</script>
